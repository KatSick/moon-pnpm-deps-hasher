$schema: https://moonrepo.dev/schemas/workspace.json

projects:
  root: .
  numbers: packages/numbers
  legacy-numbers: packages/legacy-numbers
  reports: packages/reports
  dashboard: apps/dashboard
  colors: packages/colors
  palette: apps/palette

# Tracked importer dependency inputs preserve precise resolved closures.
hasher:
  optimization: performance

vcs:
  defaultBranch: main
  hooks:
    pre-commit:
      - moon run root:deps-check -- --staged
  sync: true
