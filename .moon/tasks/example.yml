inheritedBy:
  tags: [example]

implicitInputs:
  - file: .moon-deps.json
    optional: false

fileGroups:
  project:
    - src/**/*
    - package.json
    - tsconfig.json
    - vite.config.ts
    - moon.yml

tasks:
  build:
    command: vite build
    deps:
      - ^:build
    inputs:
      - "@group(project)"
    outputs:
      - dist

  test:
    command: vitest run
    deps:
      - ^:build
    inputs:
      - "@group(project)"

  lint:
    command: oxlint --deny-warnings --config "$workspaceRoot/.oxlintrc.json" .
    inputs:
      - "@group(project)"

  format-check:
    command: oxfmt --check --config "$workspaceRoot/.oxfmtrc.json" .
    inputs:
      - "@group(project)"
